name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.6). Required for manual runs; ignored for tag pushes.'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft for pre-release validation. Set false to publish the final release.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Resolve release parameters
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
          else
            if [ -z "${INPUT_VERSION}" ]; then
              echo "Manual runs require the version input (e.g. 0.1.6)." >&2
              exit 1
            fi
            RELEASE_TAG="v${INPUT_VERSION}"
            DRAFT="${INPUT_DRAFT}"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: ${RELEASE_TAG}" >&2
            exit 1
          fi
          DRAFT_FLAG=""
          if [ "${DRAFT}" = "true" ]; then DRAFT_FLAG="--draft"; fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "DRAFT_FLAG=${DRAFT_FLAG}" >> $GITHUB_ENV
          if [ -n "${DRAFT_FLAG}" ]; then
            echo "Draft mode: release is created as DRAFT (assets downloadable by maintainers only). Publish it (gh release edit ${RELEASE_TAG} --draft=false) to make it official." >> $GITHUB_STEP_SUMMARY
          else
            echo "Publish mode: release will be published immediately." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Vet
        run: go vet ./...

      - name: Build release artifacts
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          mkdir -p dist
          MANIFEST="cmd/server/vrhub-server.exe.manifest"

          build() {
            local goos="$1" goarch="$2"
            local stage="dist/stage-${goos}-${goarch}"
            local bin="vrhub-server-${VERSION}-${goos}-${goarch}"
            local ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            rm -rf "$stage" && mkdir -p "$stage"
            echo "Building ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/${bin}${ext}" ./cmd/server/
            if [ "$goos" = "windows" ]; then
              cp "$MANIFEST" "${stage}/${bin}${ext}.manifest"
            fi
            ( cd "$stage" && zip -q -r "../vrhub-server-${goos}-${goarch}.zip" . )
          }

          build windows amd64
          build windows arm64
          build linux   amd64
          build linux   arm64
          build darwin  amd64
          build darwin  arm64

          ( cd dist && sha256sum vrhub-server-*.zip > checksums.txt )
          echo "--- dist ---"
          ls -l dist
          cat dist/checksums.txt

      - name: Extract changelog notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          # Pull the section for this version out of CHANGELOG.md.
          # Regex-free matching so it behaves the same across awk variants.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture && substr($0, 1, 1) == "[" && index($0, "]: ") > 0 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release-notes.md
          awk 'NF {p=NR} {a[NR]=$0} END {for (i=1;i<=p;i++) print a[i]}' release-notes.md > release-notes.trimmed
          mv release-notes.trimmed release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${RELEASE_TAG}" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            ${DRAFT_FLAG} \
            --notes-file release-notes.md \
            dist/vrhub-server-*.zip \
            dist/checksums.txt
